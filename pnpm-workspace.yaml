# Not a workspace — pnpm 11 keeps its settings here rather than in package.json,
# and this is the only one the project needs.
#
# Install scripts are denied by default. These two are allowed:
#   unrs-resolver  native binary behind eslint-config-next's import resolver;
#                  without it eslint cannot resolve the @/* alias.
#   esbuild        bundled by drizzle-kit, which is a dev-only migration CLI.
#                  It never runs in the deployed app.
allowBuilds:
  unrs-resolver: true
  esbuild: true
